    "@observablehq/plot": "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/+esm",

<body>
<div class="page-actions"><button class="btn ghost sm theme-toggle" type="button" data-theme-toggle>Light</button></div>
<main class="page">
  <header class="masthead">
    <p class="kicker">{{KICKER}}</p>
    <h1>{{TITLE}}</h1>
    <p class="dek">One sentence on what this shows and why it matters.</p>
  </header>

  <div class="predict" data-predict data-unlocks="#explore">
    <p>Before you touch anything: what do you expect to happen?</p>
    <div class="predict-choices">
      <button class="chip" type="button" data-choice="a">First option</button>
      <button class="chip" type="button" data-choice="b" data-correct>Second option</button>
    </div>
    <div class="predict-actions">
      <button class="btn signal" type="button" data-reveal>Lock in and reveal</button>
      <button class="skip" type="button" data-skip>Skip</button>
    </div>
    <div data-answer>
      <p>The answer, in one or two sentences, and why.</p>
    </div>
  </div>

  <figure class="figure" id="explore">
    <div class="controls">
      <label class="control"><span>Parameter <output id="value-out">50</output></span>
        <input id="value" type="range" min="0" max="100" value="50">
      </label>
    </div>
    <svg id="viz" class="chart" viewBox="0 0 640 280" role="img" aria-label="Describe what the figure shows"></svg>
    <figcaption>What to notice, in one line.</figcaption>
  </figure>

  <div class="callout">
    <p class="label">Takeaway</p>
    <p>The one sentence the reader should leave with.</p>
  </div>
</main>

<script>
/* @inline house.js */
</script>

<script type="module">
// Artifact code. Replace the example below; keep figures driven by the controls.
const input = document.querySelector("#value");
const output = document.querySelector("#value-out");
const svg = document.querySelector("#viz");

function render(value) {
  output.textContent = value;
  const height = value * 2.2;
  svg.innerHTML = `
    <g class="grid">${[0, 1, 2, 3].map((row) => `<line x1="0" x2="640" y1="${40 + row * 66}" y2="${40 + row * 66}"></line>`).join("")}</g>
    <rect x="48" y="${238 - height}" width="96" height="${height}" rx="4" fill="var(--series-1)"></rect>
    <text class="label" x="96" y="${228 - height}" text-anchor="middle">${value}</text>
    <line x1="0" x2="640" y1="238" y2="238" stroke="var(--line-strong)"></line>`;
}

input.addEventListener("input", () => render(Number(input.value)));
render(Number(input.value));
</script>
</body>
</html>
