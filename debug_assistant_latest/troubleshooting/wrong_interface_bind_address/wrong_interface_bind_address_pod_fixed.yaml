apiVersion: v1
kind: Pod
metadata:
  name: kube-wrong-interface-bind-address
  labels:
    app: kube-wrong-interface-bind-address
spec:
  containers:
  - name: kube-wrong-interface-bind-address
    image: kube-wrong-interface-bind-address-app:latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8765
    volumeMounts:
    - name: server
      mountPath: /app/server.py
      subPath: server.py
  volumes:
  - name: server
    configMap:
      name: wrong-interface-server
