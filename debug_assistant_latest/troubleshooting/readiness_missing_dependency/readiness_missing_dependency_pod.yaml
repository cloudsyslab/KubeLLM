apiVersion: v1
kind: Pod
metadata:
  name: readiness-missing-dependency-app-fixed
  labels:
    app: readiness-missing-dependency-app
spec:
  containers:
  - name: app
    image: python:3.9-slim
    imagePullPolicy: IfNotPresent
    command: ["python3", "/app/server.py"]
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
    volumeMounts:
    - name: server-src
      mountPath: /app/server.py
      subPath: server.py
  volumes:
  - name: server-src
    configMap:
      name: readiness-missing-dependency-server
