apiVersion: v1
kind: Pod
metadata:
  name: readiness-transitive-dependency-app
  labels:
    app: readiness-transitive-dependency-app
spec:
  containers:
  - name: app
    image: kube-readiness-transitive-dependency-app:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 3
