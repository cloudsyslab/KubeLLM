apiVersion: v1
kind: Pod
metadata:
  name: resource-limits-cpu-starvation-app
  labels:
    app: resource-limits-cpu-starvation-app
spec:
  containers:
  - name: app
    image: kube-resource-limits-cpu-starvation-app:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
    resources:
      limits:
        cpu: 5m
        memory: 128Mi
      requests:
        cpu: 5m
        memory: 64Mi
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 3
      timeoutSeconds: 1
